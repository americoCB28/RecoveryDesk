name: Release own application binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset msvc-release
      - run: cmake --build --preset release
      - run: ctest --preset release
      - run: python scripts/verify_pe.py build/msvc/Release/RecoveryDesk.exe --output build/msvc/pe-dependencies.json
      - run: cmake --install build/msvc --config Release --prefix dist/RecoveryDesk
      - name: Package and inventory
        shell: pwsh
        run: |
          Copy-Item third_party/manifest.json dist/RecoveryDesk/dependencies.json
          Copy-Item build/msvc/pe-dependencies.json dist/RecoveryDesk/pe-dependencies.json
          Copy-Item docs/VALIDATION.md dist/RecoveryDesk/VALIDATION.md
          Compress-Archive -Path dist/RecoveryDesk -DestinationPath dist/RecoveryDesk-windows-x64.zip
          (Get-FileHash dist/RecoveryDesk-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  RecoveryDesk-windows-x64.zip' | Set-Content dist/SHA256SUMS.txt -Encoding ASCII
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/RecoveryDesk-windows-x64.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/RecoveryDesk-windows-x64.zip dist/SHA256SUMS.txt --title "RecoveryDesk $env:GITHUB_REF_NAME" --notes "Native app alpha. WinPE/ADK not included. See VALIDATION.md for pending hardware acceptance." --prerelease --draft
